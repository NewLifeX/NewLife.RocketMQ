name: readme

# README 语言切换行由 tools/readme/sync-readme-languages.ps1 从 readme-languages.json 生成，
# NuGet 包版 README.nuget.md 由 tools/readme/sync-readme-package.ps1 从 README.md 生成。
# 手工改顺序、或某一份副本忘记同步，都会在这里被拦下。
on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-package.json'
      - 'tools/readme/**'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-package.json'
      - 'tools/readme/**'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-switcher:
    name: check readme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/readme/sync-readme-languages.ps1 -Check
    - name: Check README package copy
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/readme/sync-readme-package.ps1 -Check
