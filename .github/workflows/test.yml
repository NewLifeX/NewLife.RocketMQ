name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.x
          11.x

          11.x
    - name: Download & Extract RocketMQ
      run: |
        RMQ_VERSION="5.3.1"
        URL1="https://archive.apache.org/dist/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        URL2="https://mirrors.tuna.tsinghua.edu.cn/apache/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        curl -fsSL "$URL1" -o /tmp/rocketmq.zip || curl -fsSL "$URL2" -o /tmp/rocketmq.zip
        unzip -q /tmp/rocketmq.zip -d /tmp/
        mv /tmp/rocketmq-all-${RMQ_VERSION}-bin-release /tmp/rocketmq
        chmod +x /tmp/rocketmq/bin/*.sh

    - name: Start RocketMQ
      run: |
        RMQ_CONF=/tmp/rocketmq/conf/broker_test.conf
        echo "brokerClusterName=DefaultCluster"  > $RMQ_CONF
        echo "brokerName=broker-a"              >> $RMQ_CONF
        echo "brokerId=0"                       >> $RMQ_CONF
        echo "deleteWhen=04"                    >> $RMQ_CONF
        echo "fileReservedTime=48"              >> $RMQ_CONF
        echo "brokerRole=ASYNC_MASTER"          >> $RMQ_CONF
        echo "flushDiskType=ASYNC_FLUSH"        >> $RMQ_CONF
        echo "autoCreateTopicEnable=true"       >> $RMQ_CONF
        echo "listenPort=10911"                 >> $RMQ_CONF
        echo "storePathRootDir=/tmp/rocketmq/store" >> $RMQ_CONF
        echo "brokerIP1=127.0.0.1"              >> $RMQ_CONF
        echo "diskMaxUsedSpaceRatio=100"        >> $RMQ_CONF
        echo "diskSpaceWarningLevelRatio=100"   >> $RMQ_CONF

        # 限制 JVM 内存（GitHub Actions 仅 7GB）
        export MAX_HEAP_SIZE="256m"
        export HEAP_NEWSIZE="128m"

        echo "=== 启动 NameServer ==="
        nohup /tmp/rocketmq/bin/mqnamesrv > /tmp/namesrv.log 2>&1 &
        for i in $(seq 1 30); do
          if grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
            echo "NameServer 已启动 (PID=$(pgrep -f NamesrvStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
          echo "=== NameServer 启动失败 ==="
          cat /tmp/namesrv.log
          exit 1
        fi

        echo "=== 启动 Broker ==="
        nohup /tmp/rocketmq/bin/mqbroker -c /tmp/rocketmq/conf/broker_test.conf -n 127.0.0.1:9876 > /tmp/broker.log 2>&1 &
        for i in $(seq 1 40); do
          if grep -q "boot success" /tmp/broker.log 2>/dev/null; then
            echo "Broker 已启动 (PID=$(pgrep -f BrokerStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/broker.log 2>/dev/null; then
          echo "=== Broker 启动失败 ==="
          cat /tmp/broker.log
          exit 1
        fi

        echo "=== 启动 Proxy ==="
        # Proxy 会订阅内部主题 DefaultHeartBeatSyncerTopic，提前创建，避免其无效拉取刷满 Broker 日志并抢占拉取线程；
        # Broker 冷启动后主题路由在 NameServer 生效需要时间，Proxy 启动时系统主题创建失败即退出且不会自愈，
        # 故先等路由生效再启动 Proxy，失败则重建主题后重启（至多 3 次尝试）
        export JAVA_OPT_EXT="-Xms256m -Xmx512m"
        # runserver.sh 固定 -Xms4g -Xmx4g，JAVA_OPT_EXT 最后追加，用较小堆覆盖
        proxy_ok=0
        for attempt in 1 2 3; do
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin updateTopic -n 127.0.0.1:9876 -c DefaultCluster -t DefaultHeartBeatSyncerTopic -r 1 -w 1 > /dev/null 2>&1; then
              echo "DefaultHeartBeatSyncerTopic 已就绪（第 ${i} 次尝试）"
              break
            fi
            sleep 3
          done
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin topicRoute -n 127.0.0.1:9876 -t DefaultHeartBeatSyncerTopic 2>/dev/null | grep -q "brokerDatas"; then
              echo "DefaultHeartBeatSyncerTopic 路由已生效（第 ${i} 次检查）"
              break
            fi
            sleep 3
          done
          nohup /tmp/rocketmq/bin/mqproxy -n 127.0.0.1:9876 > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "rocketmq-proxy startup successfully" /tmp/proxy.log 2>/dev/null; then
              echo "Proxy 已启动 (PID=$(pgrep -f ProxyStartup))"
              proxy_ok=1
              break
            fi
            sleep 1
          done
          if [ "$proxy_ok" = "1" ]; then break; fi
          echo "Proxy 第 ${attempt} 次启动未成功，重建系统主题后重试"
          pkill -f ProxyStartup 2>/dev/null || true
          sleep 20
        done
        if [ "$proxy_ok" != "1" ]; then
          echo "=== Proxy 启动失败 ==="
          cat /tmp/proxy.log
          exit 1
        fi

    - name: Build
      run: |
        dotnet build -c Release

    # Broker 冷启动后主题路由注册与消费组初始化需要时间，先跑一轮轻量集成用例预热，
    # 避免紧随其后的全量测试出现偶发超时（预热本身允许失败）
    - name: Warmup
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --no-build --filter "FullyQualifiedName~GrpcIntegrationTests" || true
        sleep 10

    # 单元测试按测试类并行执行，几秒内完成；先跑一遍可快速失败，避免集成用例耗时后才暴露单元回归
    - name: Unit tests (fast)
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --no-build --filter "Category!=Integration" -v minimal

    - name: Test
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --no-build --blame-hang-timeout 10m -v n

    # NativeAOT 冒烟：裁剪环境下验证帧编解码、请求头字典、JSON 序列化、消息压缩（ZLIB 往返与上限）、
    # LMQ 属性、ACL 签名、端到端收发与 gRPC 5.x 链路
    # 裁剪告警视为错误（IL2026/IL3050/IL2104，%3B 为命令行分号转义）并关闭单告警聚合，避免回归被摘要掩盖
    - name: AOT publish & smoke
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang zlib1g-dev
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-x64 \
          -p:TrimmerSingleWarn=false -p:WarningsAsErrors=IL2026%3BIL3050%3BIL2104
        ./AotSmoke/bin/Release/net10.0/linux-x64/publish/AotSmoke

    # NuGet 包消费冒烟：消费的是打包产物而非工程引用，验证用户装包后同样能 AOT 发布并运行
    - name: Package consumption AOT smoke
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
      run: |
        dotnet pack NewLife.RocketMQ/NewLife.RocketMQ.csproj -c Release -p:Version=4.0.0-aotpackage -o /tmp/rmqpack
        dotnet restore AotPackageSmoke/AotPackageSmoke.csproj -r linux-x64 \
          -p:NewLifeRocketMQVersion=4.0.0-aotpackage \
          -p:RestoreSources="/tmp/rmqpack%3Bhttps://api.nuget.org/v3/index.json"
        dotnet publish AotPackageSmoke/AotPackageSmoke.csproj -c Release -r linux-x64 --no-restore \
          -p:TrimmerSingleWarn=false -p:WarningsAsErrors=IL2026%3BIL3050%3BIL2104
        ./AotPackageSmoke/bin/Release/net10.0/linux-x64/publish/AotPackageSmoke

    # 发布体积/启动开销/吞吐基线：写入流水线摘要，并以宽松阈值防止意外膨胀
    - name: AOT baseline
      run: |
        dotnet run --file scripts/AotBaseline.cs -- \
          --publish AotSmoke/bin/Release/net10.0/linux-x64/publish \
          --json /tmp/aot-baseline.json \
          --max-exe-mb 20 \
          --max-startup-ms 600 | tee /tmp/aot-baseline.md
        echo "### AOT 基线原始数据" >> $GITHUB_STEP_SUMMARY
        cat /tmp/aot-baseline.md >> $GITHUB_STEP_SUMMARY

    - name: Upload AOT baseline
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: aot-baseline
        path: /tmp/aot-baseline.json
        if-no-files-found: ignore

    - name: Stop RocketMQ
      if: always()
      run: |
        pkill -f BrokerStartup 2>/dev/null || true
        pkill -f NamesrvStartup 2>/dev/null || true
        pkill -f ProxyStartup 2>/dev/null || true

  # ================= 单元测试 RID 矩阵（观察期，结构对齐 NewLife.Core 跨平台矩阵） =================
  # linux-x64 的全量测试由上方 build-test 既有 job 承担；本段补齐 win-x64 / linux-arm64 / linux-la64。
  # 三个新 job 首轮观察期（continue-on-error），连续稳定全绿后逐项去掉该标记转阻断。
  # 每个平台直接在 runner 内安装 RocketMQ（win 用 scripts/RocketMqSetup.cs，linux 内联脚本），全量用例含 gRPC 集成。

  unit-win-x64:
    name: unit (win-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true     # 观察期：连续全绿后转阻断

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Pre-download RocketMQ
      shell: pwsh
      # 启动脚本的镜像顺序为国内源优先，CI（Azure 主机）改从 apache 归档先取，失败再回退清华镜像
      run: |
        New-Item -ItemType Directory -Force C:\RocketMQ | Out-Null
        $dest = 'C:\RocketMQ\rocketmq-all-5.3.1-bin-release.zip'
        curl.exe -fsSL --retry 3 "https://archive.apache.org/dist/rocketmq/5.3.1/rocketmq-all-5.3.1-bin-release.zip" -o $dest
        if ($LASTEXITCODE -ne 0) {
          curl.exe -fsSL --retry 3 "https://mirrors.tuna.tsinghua.edu.cn/apache/rocketmq/5.3.1/rocketmq-all-5.3.1-bin-release.zip" -o $dest
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }
    - name: Start RocketMQ
      # 启动 NameServer + Broker + Proxy 并准备 Proxy 内部主题
      run: dotnet run --file scripts/RocketMqSetup.cs
    # Broker 冷启动后主题路由注册与消费组初始化需要时间，先跑一轮轻量集成用例预热（预热本身允许失败）
    - name: Warmup
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --filter "FullyQualifiedName~GrpcIntegrationTests" || true
        Start-Sleep -Seconds 10
    - name: Test
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release -v n --logger "trx;LogFileName=unit-win-x64.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-unit-win-x64
        path: TestResults/*.trx
        if-no-files-found: ignore
    - name: Stop RocketMQ
      if: always()
      run: dotnet run --file scripts/RocketMqSetup.cs -- --stop

  unit-linux-arm64:
    name: unit (linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    continue-on-error: true     # 观察期：连续全绿后转阻断

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Download & Extract RocketMQ
      run: |
        RMQ_VERSION="5.3.1"
        URL1="https://archive.apache.org/dist/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        URL2="https://mirrors.tuna.tsinghua.edu.cn/apache/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        curl -fsSL "$URL1" -o /tmp/rocketmq.zip || curl -fsSL "$URL2" -o /tmp/rocketmq.zip
        unzip -q /tmp/rocketmq.zip -d /tmp/
        mv /tmp/rocketmq-all-${RMQ_VERSION}-bin-release /tmp/rocketmq
        chmod +x /tmp/rocketmq/bin/*.sh
    - name: Start RocketMQ
      run: |
        RMQ_CONF=/tmp/rocketmq/conf/broker_test.conf
        echo "brokerClusterName=DefaultCluster"  > $RMQ_CONF
        echo "brokerName=broker-a"              >> $RMQ_CONF
        echo "brokerId=0"                       >> $RMQ_CONF
        echo "deleteWhen=04"                    >> $RMQ_CONF
        echo "fileReservedTime=48"              >> $RMQ_CONF
        echo "brokerRole=ASYNC_MASTER"          >> $RMQ_CONF
        echo "flushDiskType=ASYNC_FLUSH"        >> $RMQ_CONF
        echo "autoCreateTopicEnable=true"       >> $RMQ_CONF
        echo "listenPort=10911"                 >> $RMQ_CONF
        echo "storePathRootDir=/tmp/rocketmq/store" >> $RMQ_CONF
        echo "brokerIP1=127.0.0.1"              >> $RMQ_CONF
        echo "diskMaxUsedSpaceRatio=100"        >> $RMQ_CONF
        echo "diskSpaceWarningLevelRatio=100"   >> $RMQ_CONF

        # 限制 JVM 内存（GitHub Actions 仅 7GB）
        export MAX_HEAP_SIZE="256m"
        export HEAP_NEWSIZE="128m"

        echo "=== 启动 NameServer ==="
        nohup /tmp/rocketmq/bin/mqnamesrv > /tmp/namesrv.log 2>&1 &
        for i in $(seq 1 30); do
          if grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
            echo "NameServer 已启动 (PID=$(pgrep -f NamesrvStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
          echo "=== NameServer 启动失败 ==="
          cat /tmp/namesrv.log
          exit 1
        fi

        echo "=== 启动 Broker ==="
        nohup /tmp/rocketmq/bin/mqbroker -c /tmp/rocketmq/conf/broker_test.conf -n 127.0.0.1:9876 > /tmp/broker.log 2>&1 &
        for i in $(seq 1 40); do
          if grep -q "boot success" /tmp/broker.log 2>/dev/null; then
            echo "Broker 已启动 (PID=$(pgrep -f BrokerStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/broker.log 2>/dev/null; then
          echo "=== Broker 启动失败 ==="
          cat /tmp/broker.log
          exit 1
        fi

        echo "=== 启动 Proxy ==="
        # Proxy 会订阅内部主题 DefaultHeartBeatSyncerTopic，提前创建，避免其无效拉取刷满 Broker 日志并抢占拉取线程；
        # Broker 冷启动后主题路由在 NameServer 生效需要时间，Proxy 启动时系统主题创建失败即退出且不会自愈，
        # 故先等路由生效再启动 Proxy，失败则重建主题后重启（至多 3 次尝试）
        export JAVA_OPT_EXT="-Xms256m -Xmx512m"
        # runserver.sh 固定 -Xms4g -Xmx4g，JAVA_OPT_EXT 最后追加，用较小堆覆盖
        proxy_ok=0
        for attempt in 1 2 3; do
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin updateTopic -n 127.0.0.1:9876 -c DefaultCluster -t DefaultHeartBeatSyncerTopic -r 1 -w 1 > /dev/null 2>&1; then
              echo "DefaultHeartBeatSyncerTopic 已就绪（第 ${i} 次尝试）"
              break
            fi
            sleep 3
          done
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin topicRoute -n 127.0.0.1:9876 -t DefaultHeartBeatSyncerTopic 2>/dev/null | grep -q "brokerDatas"; then
              echo "DefaultHeartBeatSyncerTopic 路由已生效（第 ${i} 次检查）"
              break
            fi
            sleep 3
          done
          nohup /tmp/rocketmq/bin/mqproxy -n 127.0.0.1:9876 > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "rocketmq-proxy startup successfully" /tmp/proxy.log 2>/dev/null; then
              echo "Proxy 已启动 (PID=$(pgrep -f ProxyStartup))"
              proxy_ok=1
              break
            fi
            sleep 1
          done
          if [ "$proxy_ok" = "1" ]; then break; fi
          echo "Proxy 第 ${attempt} 次启动未成功，重建系统主题后重试"
          pkill -f ProxyStartup 2>/dev/null || true
          sleep 20
        done
        if [ "$proxy_ok" != "1" ]; then
          echo "=== Proxy 启动失败 ==="
          cat /tmp/proxy.log
          exit 1
        fi
    # Broker 冷启动后主题路由注册与消费组初始化需要时间，先跑一轮轻量集成用例预热（预热本身允许失败）
    - name: Warmup
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --filter "FullyQualifiedName~GrpcIntegrationTests" || true
        sleep 10
    - name: Test
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release -v n --logger "trx;LogFileName=unit-linux-arm64.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-unit-linux-arm64
        path: TestResults/*.trx
        if-no-files-found: ignore
    - name: Stop RocketMQ
      if: always()
      run: |
        pkill -f BrokerStartup 2>/dev/null || true
        pkill -f NamesrvStartup 2>/dev/null || true
        pkill -f ProxyStartup 2>/dev/null || true

  # 龙芯 LA64（必选，每次 push/PR）：托管 runner 无 LA64 原生环境，按 NewLife.Core 配方用 QEMU 用户态仿真 + 龙芯 SDK。
  # 裸宿主缺 LA64 动态加载器（实测 Could not open /lib64/ld-linux-loongarch-lp64d.so.1），SDK 必须在 loong64 容器内执行；
  # 还原与构建放宿主 x64 SDK（龙芯 SDK 的 MSBuild 在 QEMU 下不稳），容器内用自宿主 xUnit 执行器（龙芯 vstest 不识别该架构）。
  # 服务端跑在宿主 x64，容器用 host 网络直连 127.0.0.1，全量用例含 gRPC 集成。
  # 观察期：连续稳定全绿后去掉 continue-on-error 转阻断；有龙芯真机后可升级 self-hosted runner。
  unit-la64:
    name: unit (linux-loongarch64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true     # 观察期：连续全绿后转阻断

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup dotNET (host)
      # 宿主 x64 SDK：用于预热构建与测试（LA64 测试使用龙芯 SDK）
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Download & Extract RocketMQ
      run: |
        RMQ_VERSION="5.3.1"
        URL1="https://archive.apache.org/dist/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        URL2="https://mirrors.tuna.tsinghua.edu.cn/apache/rocketmq/${RMQ_VERSION}/rocketmq-all-${RMQ_VERSION}-bin-release.zip"
        curl -fsSL "$URL1" -o /tmp/rocketmq.zip || curl -fsSL "$URL2" -o /tmp/rocketmq.zip
        unzip -q /tmp/rocketmq.zip -d /tmp/
        mv /tmp/rocketmq-all-${RMQ_VERSION}-bin-release /tmp/rocketmq
        chmod +x /tmp/rocketmq/bin/*.sh
    - name: Start RocketMQ
      run: |
        RMQ_CONF=/tmp/rocketmq/conf/broker_test.conf
        echo "brokerClusterName=DefaultCluster"  > $RMQ_CONF
        echo "brokerName=broker-a"              >> $RMQ_CONF
        echo "brokerId=0"                       >> $RMQ_CONF
        echo "deleteWhen=04"                    >> $RMQ_CONF
        echo "fileReservedTime=48"              >> $RMQ_CONF
        echo "brokerRole=ASYNC_MASTER"          >> $RMQ_CONF
        echo "flushDiskType=ASYNC_FLUSH"        >> $RMQ_CONF
        echo "autoCreateTopicEnable=true"       >> $RMQ_CONF
        echo "listenPort=10911"                 >> $RMQ_CONF
        echo "storePathRootDir=/tmp/rocketmq/store" >> $RMQ_CONF
        echo "brokerIP1=127.0.0.1"              >> $RMQ_CONF
        echo "diskMaxUsedSpaceRatio=100"        >> $RMQ_CONF
        echo "diskSpaceWarningLevelRatio=100"   >> $RMQ_CONF

        export MAX_HEAP_SIZE="256m"
        export HEAP_NEWSIZE="128m"

        echo "=== 启动 NameServer ==="
        nohup /tmp/rocketmq/bin/mqnamesrv > /tmp/namesrv.log 2>&1 &
        for i in $(seq 1 30); do
          if grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
            echo "NameServer 已启动 (PID=$(pgrep -f NamesrvStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/namesrv.log 2>/dev/null; then
          echo "=== NameServer 启动失败 ==="
          cat /tmp/namesrv.log
          exit 1
        fi

        echo "=== 启动 Broker ==="
        nohup /tmp/rocketmq/bin/mqbroker -c /tmp/rocketmq/conf/broker_test.conf -n 127.0.0.1:9876 > /tmp/broker.log 2>&1 &
        for i in $(seq 1 40); do
          if grep -q "boot success" /tmp/broker.log 2>/dev/null; then
            echo "Broker 已启动 (PID=$(pgrep -f BrokerStartup))"
            break
          fi
          sleep 1
        done
        if ! grep -q "boot success" /tmp/broker.log 2>/dev/null; then
          echo "=== Broker 启动失败 ==="
          cat /tmp/broker.log
          exit 1
        fi

        echo "=== 启动 Proxy ==="
        # Proxy 会订阅内部主题 DefaultHeartBeatSyncerTopic；Broker 冷启动后主题路由在 NameServer 生效需要时间，
        # Proxy 启动时系统主题创建失败即退出且不会自愈，故先等路由生效再启动，失败则重建主题后重启（至多 3 次尝试）
        export JAVA_OPT_EXT="-Xms256m -Xmx512m"
        proxy_ok=0
        for attempt in 1 2 3; do
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin updateTopic -n 127.0.0.1:9876 -c DefaultCluster -t DefaultHeartBeatSyncerTopic -r 1 -w 1 > /dev/null 2>&1; then
              echo "DefaultHeartBeatSyncerTopic 已就绪（第 ${i} 次尝试）"
              break
            fi
            sleep 3
          done
          for i in $(seq 1 10); do
            if /tmp/rocketmq/bin/mqadmin topicRoute -n 127.0.0.1:9876 -t DefaultHeartBeatSyncerTopic 2>/dev/null | grep -q "brokerDatas"; then
              echo "DefaultHeartBeatSyncerTopic 路由已生效（第 ${i} 次检查）"
              break
            fi
            sleep 3
          done
          nohup /tmp/rocketmq/bin/mqproxy -n 127.0.0.1:9876 > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "rocketmq-proxy startup successfully" /tmp/proxy.log 2>/dev/null; then
              echo "Proxy 已启动 (PID=$(pgrep -f ProxyStartup))"
              proxy_ok=1
              break
            fi
            sleep 1
          done
          if [ "$proxy_ok" = "1" ]; then break; fi
          echo "Proxy 第 ${attempt} 次启动未成功，重建系统主题后重试"
          pkill -f ProxyStartup 2>/dev/null || true
          sleep 20
        done
        if [ "$proxy_ok" != "1" ]; then
          echo "=== Proxy 启动失败 ==="
          cat /tmp/proxy.log
          exit 1
        fi
    # Broker 冷启动后主题路由注册与消费组初始化需要时间，先跑一轮轻量集成用例预热（预热本身允许失败）；
    # 同时为后续 QEMU 内的构建留下宿主编译产物（增量复用，避免在仿真下全量编译）
    - name: Warmup (host)
      env:
        ROCKETMQ_NAMESERVER: "127.0.0.1:9876"
        ROCKETMQ_GRPC_PROXY: "http://127.0.0.1:8081"
      run: |
        dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --filter "FullyQualifiedName~GrpcIntegrationTests" || true
        sleep 10
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      # 宿主下载（GitHub 直连快），容器通过挂载点使用；容器内 --info 是 QEMU 通路的第一道验证
      run: |
        curl -fL --retry 3 --retry-delay 5 --retry-all-errors -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Build Test Assembly (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳（NuGet 还原触发 RemoveDuplicates 任务 NRE，MSB4018）；
      # 还原与构建放宿主 x64 SDK，产出 RID 无关 IL，容器内仅以 LA64 运行时执行
      run: |
        dotnet restore XUnitTestRocketMQ/XUnitTest.csproj
        dotnet build XUnitTestRocketMQ/XUnitTest.csproj -c Release --no-restore
    - name: Build Self-host xUnit Runner (host x64 SDK)
      # 龙芯 SDK 自带 vstest 不识别 LoongArch64，宿主 vstest 为 x64 R2R 复合镜像亦无法加载（BadImageFormatException）；
      # 故绕开 vstest，用 xunit.runner.utility 构建纯 IL 执行器，容器内直接执行测试程序集
      run: |
        mkdir -p /tmp/selfhost
        cat > /tmp/selfhost/xr.csproj <<'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0</TargetFramework>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="xunit.runner.utility" Version="2.9.3" />
          </ItemGroup>
        </Project>
        EOF
        cat > /tmp/selfhost/Program.cs <<'EOF'
        using System;
        using System.IO;
        using System.Threading;
        using Xunit.Runners;

        if (args.Length < 1)
        {
            Console.WriteLine("用法: xr <testAssembly.dll>");
            return 2;
        }

        var path = Path.GetFullPath(args[0]);
        var testDir = Path.GetDirectoryName(path)!;

        // 无 AppDomain 模式下，xunit 以 Assembly.Load(名称) 装载测试程序集，
        // 需要把测试输出目录挂到默认加载上下文的解析链上
        System.Runtime.Loader.AssemblyLoadContext.Default.Resolving += (ctx, name) =>
        {
            var file = Path.Combine(testDir, name.Name + ".dll");

            return File.Exists(file) ? ctx.LoadFromAssemblyPath(file) : null;
        };

        var pass = 0;
        var fail = 0;
        var skip = 0;

        using var runner = AssemblyRunner.WithoutAppDomain(path);
        runner.OnTestPassed = _ => Interlocked.Increment(ref pass);
        runner.OnTestSkipped = _ => Interlocked.Increment(ref skip);
        runner.OnTestFailed = info =>
        {
            Interlocked.Increment(ref fail);
            Console.WriteLine($"FAIL {info.TestDisplayName}: {info.ExceptionMessage}");
        };

        var done = new ManualResetEventSlim(false);
        runner.OnExecutionComplete = info =>
        {
            Console.WriteLine($"TOTAL pass={pass} fail={fail} skip={skip} time={info.ExecutionTime:n1}s");
            done.Set();
        };

        runner.Start();
        done.Wait();

        return fail > 0 ? 1 : 0;
        EOF
        dotnet build /tmp/selfhost/xr.csproj -c Release --nologo
    - name: Test (LA64, QEMU)
      # 容器内补装 libicu/libssl：文化与网络用例依赖；DOTNET_EnableHWIntrinsic=0 规避仿真层非法指令；
      # host 网络让 127.0.0.1 直连宿主 Broker/Proxy；自宿主执行器复制进测试输出目录，保持 AppContext.BaseDirectory 与正常执行一致。
      # 步骤分段：安装与 --info 失败视为环境故障（红），用例失败仅打印不阻断（观察期）
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        docker run --rm --platform linux/loong64 --network host \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -v "/tmp/selfhost/bin/Release/net10.0:/opt/selfhost:ro" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          -e ROCKETMQ_NAMESERVER=127.0.0.1:9876 \
          -e ROCKETMQ_GRPC_PROXY=http://127.0.0.1:8081 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libicu-dev libssl-dev >/dev/null
            /opt/dotnet/dotnet --info
            cd /src/Bin/UnitTest
            cp /opt/selfhost/* .
            set +e
            timeout 150m /opt/dotnet/dotnet ./xr.dll ./XUnitTest.dll
            rc=$?
            [ "$rc" -eq 0 ] || echo "LA64 全量测试失败或超时（观察期，不阻断；rc=$rc）"
            exit 0
          '
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-unit-la64
        path: TestResults/*.trx
        if-no-files-found: ignore
    - name: Stop RocketMQ
      if: always()
      run: |
        pkill -f BrokerStartup 2>/dev/null || true
        pkill -f NamesrvStartup 2>/dev/null || true
        pkill -f ProxyStartup 2>/dev/null || true

  localization:
    name: localization checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Check locales
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem -Path . -Recurse -Directory -Filter Locales | ForEach-Object {
          if (Test-Path (Join-Path $_.FullName 'zh-Hans.yml')) {
            $src = Split-Path $_.FullName -Parent
            pwsh -File ./tools/localization/check-locales.ps1 -LocaleDir $_.FullName -Baseline zh-Hans.yml -SourceDir $src
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
        }
        if ($failed) { exit 1 }
    - name: Check README languages
      shell: pwsh
      run: pwsh -File ./tools/readme/sync-readme-languages.ps1 -Check
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    # 词表一致性脚本看不到“译文是否真的能查到”，这里跑 I18n 命名空间下的全部用例补上运行时验证（无需 Broker）：
    # LocalizationTests 校验译文/回退/带前缀日志，CultureRobustnessTests 校验跨文化协议格式化与逐语言逐词条命中
    - name: Localization tests
      run: dotnet test XUnitTestRocketMQ/XUnitTest.csproj -c Release --filter "FullyQualifiedName~XUnitTest.I18n"
