"Enterprise RocketMQ Client": "عميل RocketMQ للمؤسسات"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "عميل RocketMQ مؤسسي مُدار بالكامل يدعم بروتوكولي Remoting 4.x/5.x وgRPC 5.x Proxy. لا تبعيات خارجية: لا حاجة إلى وقت تشغيل Java أو gRPC أو Protobuf. محوّلات موحّدة لـ Alibaba Cloud وHuawei Cloud وTencent Cloud وApache ACL، مع إعادة محاولة الاستهلاك وقائمة الرسائل الميتة والرسائل المعاملاتية والاستهلاك المرتّب واستهلاك Pop. مُثبت في أنظمة إنتاج بمقياس المليارات."
