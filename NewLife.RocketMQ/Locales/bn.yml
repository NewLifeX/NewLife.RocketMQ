"Reached the end of the data while reading a varint.": "varint পড়ার সময় ডেটার শেষে পৌঁছেছে।"
"The varint encoding is too long.": "varint এনকোডিং খুব দীর্ঘ।"
"The NameServer address is not specified.": "NameServer ঠিকানা নির্দিষ্ট করা হয়নি।"
