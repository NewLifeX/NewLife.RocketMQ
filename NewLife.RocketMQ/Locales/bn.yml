"ZSTD compression requires the NewLife.RocketMQ.Extensions package. Add it and call MessageCompressorRegistry.Register(2, new ZstdMessageCompressor()).": "ZSTD কম্প্রেশনের জন্য NewLife.RocketMQ.Extensions প্যাকেজ প্রয়োজন। এটি যোগ করুন এবং MessageCompressorRegistry.Register(2, new ZstdMessageCompressor()) কল করুন।"
