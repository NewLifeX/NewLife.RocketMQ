"Enterprise RocketMQ Client": "Enterprise RocketMQ-klient"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Enterprise RocketMQ-klient med fuld forvaltning og understøttelse af dobbeltprotokol for Remoting 4.x/5.x og gRPC 5.x Proxy. Ingen eksterne afhængigheder: ingen Java-, gRPC- eller Protobuf-runtime påkrævet. Ensartede adaptere til Alibaba Cloud, Huawei Cloud, Tencent Cloud og Apache ACL, med genforsøg på forbrug, dead-letter-kø, transaktionsmeddelelser, ordnet forbrug og Pop-forbrug. Dokumenteret i produktionssystemer i milliardstørrelse."
