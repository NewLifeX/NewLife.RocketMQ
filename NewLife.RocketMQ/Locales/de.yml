"Enterprise RocketMQ Client": "Enterprise-RocketMQ-Client"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Vollständig verwalteter RocketMQ-Client in Enterprise-Qualität mit Dual-Protokoll-Unterstützung für Remoting 4.x/5.x und gRPC 5.x Proxy. Keine externen Abhängigkeiten: keine Java-, gRPC- oder Protobuf-Laufzeit erforderlich. Einheitliche Adapter für Alibaba Cloud, Huawei Cloud, Tencent Cloud und Apache ACL, mit Consume-Retry, Dead-Letter-Queue, transaktionalen Nachrichten, geordneter Verarbeitung und Pop-Consumption. In Produktionssystemen im Milliardenmaßstab bewährt."
