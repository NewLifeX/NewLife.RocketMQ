"Enterprise RocketMQ Client": "Cliente RocketMQ empresarial"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Cliente RocketMQ empresarial totalmente administrado con soporte de doble protocolo para Remoting 4.x/5.x y gRPC 5.x Proxy. Cero dependencias externas: no se requiere runtime de Java, gRPC ni Protobuf. Adaptadores unificados para Alibaba Cloud, Huawei Cloud, Tencent Cloud y Apache ACL, con reintento de consumo, cola de mensajes muertos, mensajes transaccionales, consumo ordenado y consumo Pop. Probado en sistemas de producción a escala de miles de millones."
