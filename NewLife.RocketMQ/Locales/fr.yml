"Enterprise RocketMQ Client": "Client RocketMQ d'entreprise"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Client RocketMQ d'entreprise entièrement managé avec prise en charge du double protocole Remoting 4.x/5.x et gRPC 5.x Proxy. Aucune dépendance externe : aucun runtime Java, gRPC ou Protobuf requis. Adaptateurs unifiés pour Alibaba Cloud, Huawei Cloud, Tencent Cloud et Apache ACL, avec nouvelle tentative de consommation, file de messages morts, messages transactionnels, consommation ordonnée et consommation Pop. Éprouvé dans des systèmes de production à l'échelle du milliard."
