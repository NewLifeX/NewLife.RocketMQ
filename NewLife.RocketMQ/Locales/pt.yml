"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Cliente RocketMQ empresarial totalmente gerenciado com suporte a protocolo duplo para Remoting 4.x/5.x e gRPC 5.x Proxy. Zero dependências externas: nenhum runtime Java, gRPC ou Protobuf necessário. Adaptadores unificados para Alibaba Cloud, Huawei Cloud, Tencent Cloud e Apache ACL, com nova tentativa de consumo, fila de mensagens mortas, mensagens transacionais, consumo ordenado e consumo Pop. Comprovado em sistemas de produção em escala de bilhões."
