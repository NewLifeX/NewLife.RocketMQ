"Enterprise RocketMQ Client": "Enterprise RocketMQ-klient"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Enterprise RocketMQ-klient med fullständig hantering och stöd för dubbla protokoll: Remoting 4.x/5.x och gRPC 5.x Proxy. Inga externa beroenden: ingen Java-, gRPC- eller Protobuf-runtime krävs. Enhetliga adaptrar för Alibaba Cloud, Huawei Cloud, Tencent Cloud och Apache ACL, med återförsök av konsumtion, kö för olevererbara meddelanden, transaktionsmeddelanden, ordnad konsumtion och Pop-konsumtion. Bevisad i produktionssystem i miljardskala."
