"Enterprise RocketMQ Client": "Kurumsal RocketMQ istemcisi"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Remoting 4.x/5.x ve gRPC 5.x Proxy için çift protokol desteğine sahip, kurumsal düzeyde tam yönetilen RocketMQ istemcisi. Harici bağımlılık yok: Java, gRPC veya Protobuf çalışma zamanı gerekmez. Alibaba Cloud, Huawei Cloud, Tencent Cloud ve Apache ACL için birleşik bağdaştırıcılar; tüketim yeniden denemesi, ölü mektup kuyruğu, işlemsel mesajlar, sıralı tüketim ve Pop tüketimi ile. Milyarlarca ölçekli üretim sistemlerinde kanıtlanmıştır."
