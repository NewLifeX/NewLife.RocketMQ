"Enterprise RocketMQ Client": "Ứng dụng khách RocketMQ doanh nghiệp"
"Enterprise-grade fully managed RocketMQ client with dual-protocol support for Remoting 4.x/5.x and gRPC 5.x Proxy. Zero external dependencies: no Java, gRPC or Protobuf runtime required. Unified adapters for Alibaba Cloud, Huawei Cloud, Tencent Cloud and Apache ACL, with consume retry, dead-letter queue, transactional messages, ordered consumption and Pop consumption. Proven in billion-scale production systems.": "Ứng dụng khách RocketMQ cấp doanh nghiệp được quản lý hoàn toàn, hỗ trợ hai giao thức Remoting 4.x/5.x và gRPC 5.x Proxy. Không có phụ thuộc bên ngoài: không cần runtime Java, gRPC hoặc Protobuf. Bộ chuyển đổi thống nhất cho Alibaba Cloud, Huawei Cloud, Tencent Cloud và Apache ACL, với thử lại tiêu thụ, hàng đợi thư chết, tin nhắn giao dịch, tiêu thụ theo thứ tự và tiêu thụ Pop. Đã được chứng minh trong các hệ thống sản xuất quy mô hàng tỷ."
